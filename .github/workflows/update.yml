name: Update link-in-bio
on:
  schedule: [{cron: "17 15 * * *"}]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: update-link-in-bio
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow numpy
      - run: python3 update.py --no-push
      - name: Commit updated site files
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add index.html posts.json img
          if ! git diff --cached --quiet; then
            git commit -m "auto update"
            git push origin main
          fi
      # Bot pushes do not automatically trigger branch-based Pages builds.
      - name: Rebuild GitHub Pages from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
